# CI: backend（ruff・pytest。Postgres 16 のサービスコンテナ付き）と frontend（lint・build）。
# ブランチ保護の Required checks 名: "CI (backend)" / "CI (frontend)"（ジョブ名と文字列一致させる）
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: CI (backend)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # CI 専用の使い捨て DB（ジョブ内のコンテナだけ。秘匿値ではない）
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: ballon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_only_password@localhost:5432/ballon_test
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-10-17 確認)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (2026-10-17 確認)
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements-dev.txt

      - name: install deps
        run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest -q

  frontend:
    name: CI (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    env:
      # 秘匿値ではない（ブラウザに配られる値）。リポジトリ変数から渡す
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-10-17 確認)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (2026-10-17 確認)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
