# 画面（app-ballon-web-nonooktk）の手動デプロイ。雛形。実行は統括の承認後だけ。
# main への push では動かない（workflow_dispatch のみ）。
# ログインは OIDC（ユーザー割り当てマネージド ID）。手順: docs/azure-setup.md §4
# NEXT_PUBLIC_* はビルド時に埋め込まれる。リポジトリ変数（Settings > Secrets and variables > Actions > Variables）で渡す。
# 切り戻し: git_ref に前回デプロイしたコミットを指定して、もう一度実行する。
name: deploy-web

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "配備するコミット（main の SHA または main）。切り戻しは前回の SHA"
        required: true
        default: main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  WEBAPP_NAME: app-ballon-web-nonooktk
  RESOURCE_GROUP: rg-001-gen12

jobs:
  deploy:
    name: Deploy Web
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: git_ref の形式を確認
        env:
          GIT_REF: ${{ inputs.git_ref }}
        run: |
          if [[ ! "$GIT_REF" =~ ^(main|[0-9a-f]{7,40})$ ]]; then
            echo "git_ref は main か 7〜40 桁の SHA にしてください" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-10-17 確認)
        with:
          ref: ${{ inputs.git_ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (2026-10-17 確認)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: ビルド（standalone）
        working-directory: app/frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
        run: |
          npm ci
          npm run build
          # standalone に静的ファイルと public を足す（next の標準手順）
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi

      - name: zip を作る
        working-directory: app/frontend/.next/standalone
        run: zip -r -q "$RUNNER_TEMP/web.zip" .

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0 (2026-10-17 確認)
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # SCM_DO_BUILD_DURING_DEPLOYMENT=false（アプリ設定）。ビルド済みをそのまま置く。起動は node server.js
      - name: zip deploy
        run: |
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME" \
            --src-path "$RUNNER_TEMP/web.zip" --type zip

      - name: トップページの確認
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null "https://$WEBAPP_NAME.azurewebsites.net/"; then exit 0; fi
            sleep 20
          done
          echo "トップページが開きません" >&2
          exit 1
